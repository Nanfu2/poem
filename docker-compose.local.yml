version: '3.8'
services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15
    container_name: poem-db
    environment:
      POSTGRES_DB: poem_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin数据库管理界面
  pgadmin:
    image: dpage/pgadmin4
    container_name: poem-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@poem.ai
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      postgres:
        condition: service_healthy

  # 本地开发服务器（Vite）
  frontend:
    image: node:18-alpine
    container_name: poem-frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_SUPABASE_URL=http://localhost:5432
      - VITE_SUPABASE_ANON_KEY=local-dev-key
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      postgres:
        condition: service_healthy

  # 模拟Edge Function的本地服务器
  edge-functions:
    image: node:18-alpine
    container_name: poem-edge-functions
    working_dir: /app
    volumes:
      - ./supabase/functions:/app
    ports:
      - "9999:9999"
    environment:
      - SUPABASE_URL=http://postgres:5432
      - SUPABASE_ANON_KEY=local-dev-key
      - OPENAI_API_KEY=your-test-key
    command: sh -c "npm install -g @supabase/functions-js && npx serve -s /app -p 9999"

volumes:
  postgres_data: